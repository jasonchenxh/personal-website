short_bio: >-
  I am currently a postgraduate student majoring in Safety Engineering at <a href="https://www.scut.edu.cn/new/">South China University of Technology (SCUT)</a>. Before this I graduated as a Bachelor in Safety Engineering student at <a href="https://www.neu.edu.cn/">Northeastern University (NEU)</a> in the year 2022. <br> 
  I am seeking a PhD opportunity for Fall 2025/Spring 2026. My research interests include CO2 Sequestration / Unconventional Oil and Gas Extraction / Safety Science and Engineering / Emergency Management and Evacuation / Artificial Intelligence (AI) / Computational Fluid Dynamics (CFD) / Simulation, Modelling and Numerical Methods.<br>
  If you are interested in me, feel free to read my CV via the <a href="https://jasonchenxh.github.io/personal-website/assets/cv/CV_XinhuiChen250402.pdf">🔗link</a>. 
  
